<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>BIOPAR</title>
  <meta name="description" content="Soluções biológicas de alta pureza e densidade celular para agricultura de alta produtividade. Inoculantes, biofungicidas, bioinseticidas e inteligência de mercado agro.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./static/assets/logo-biopar.svg">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#60B73F',
              dark: '#52A633',
              light: '#EBF7E7',
              emerald: '#007A42'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Arial', 'sans-serif'],
            heading: ['"Lenia Sans"', '"Leni Sans"', 'sans-serif'],
            mono: ['Arial', 'sans-serif']
          },
          borderRadius: {
            '2xl': '20px',
            '3xl': '28px',
            'full': '9999px'
          }
        }
      }
    }
  </script>

  <!-- Biopar Design System Styles -->
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body class="bg-white text-[#1D1D1F] flex flex-col min-h-screen antialiased selection:bg-[#60B73F]/20 selection:text-neutral-900">

  <!-- Header Global -->
  <div id="app-header"></div>

  <!-- Conteúdo Dinâmico SPA -->
  <main id="app-content" class="flex-grow w-full"></main>

  <!-- Footer Global -->
  <div id="app-footer"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Application Bootstrap (ES Modules) -->
  <script type="module">
    import { router } from './src/services/router.js';
    import { marketService } from './src/services/marketProvider.js';
    import { renderHeader } from './src/components/Header.js';
    import { renderFooter } from './src/components/Footer.js';

    import { createHomePage } from './src/pages/HomePage.js';
    import { createCatalogPage } from './src/pages/CatalogPage.js';
    import { createCategoryPage } from './src/pages/CategoryPage.js';
    import { createProductDetailPage } from './src/pages/ProductDetailPage.js';
    import { createBlogPage } from './src/pages/BlogPage.js';
    import { createArticleDetailPage } from './src/pages/ArticleDetailPage.js';
    import { createPrivacyPolicyPage } from './src/pages/PrivacyPolicyPage.js';
    import { createTermsOfUsePage } from './src/pages/TermsOfUsePage.js';
    import { createCookiesPage } from './src/pages/CookiesPage.js';
    import { createProducerPage } from './src/pages/ProducerLandingPage.js';
    import { createAdminPage } from './src/pages/AdminPage.js';

    // Monta Layout Global
    const headerContainer = document.getElementById('app-header');
    const footerContainer = document.getElementById('app-footer');

    if (headerContainer) headerContainer.appendChild(renderHeader());
    if (footerContainer) footerContainer.appendChild(renderFooter());

    // Registra Rotas SPA
    router
      .add('/', createHomePage)
      .add('/produtos', createCatalogPage)
      .add('/produtos/categoria/:categorySlug', createCategoryPage)
      .add('/produtos/:slug', createProductDetailPage)
      .add('/blog', createBlogPage)
      .add('/blog/:slug', createArticleDetailPage)
      .add('/admin', createAdminPage)
      .add('/login', createAdminPage)
      .add('/privacidade', createPrivacyPolicyPage)
      .add('/politica-de-privacidade', createPrivacyPolicyPage)
      .add('/termos', createTermsOfUsePage)
      .add('/termos-de-uso', createTermsOfUsePage)
      .add('/cookies', createCookiesPage)
      .add('/produtor', createProducerPage)
      .add('/produtores', createProducerPage);

    // Suporte para rotas diretas digitadas sem hash (ex: /produtor -> /#/produtor)
    if (window.location.pathname && window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
      const cleanPath = window.location.pathname.replace(/^\/+/, '/');
      window.history.replaceState(null, '', '/#' + cleanPath + window.location.search);
    }

    // Inicializa Provedores e Roteamento
    marketService.init();
    router.init();
  </script>
</body>
</html>
